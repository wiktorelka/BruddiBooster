# nginx front for BruddiBooster.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bruddibooster
#   sudo ln -s /etc/nginx/sites-available/bruddibooster /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d panel.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# The proxy_set_header lines below are what make TRUST_PROXY=1 safe: nginx overwrites
# the client's own X-Forwarded-For, so the rate limiter sees the real address instead
# of one the caller chose.

server {
    listen 80;
    server_name panel.example.com;
    # Everything over TLS. Session cookies are only marked Secure on HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Bulk import posts large bodies.
    client_max_body_size 12m;

    # Slow down brute force at the edge as well as in the app.
    limit_req_zone $binary_remote_addr zone=bblogin:10m rate=10r/m;

    location /api/login {
        limit_req zone=bblogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # socket.io needs the upgrade headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
